
name: OT Security Rule Validation

on:
  push:
    branches: [master, main]
    paths:
      - 'rules/**'
      - 'pcaps/**'
      - '.github/workflows/**'
      - 'terraform/**'
  pull_request:
    branches: [master, main]
    paths:
      - 'rules/**'
      - 'pcaps/**'
      - '.github/workflows/**'
      - 'terraform/**'

jobs:
  validate-suricata-rules:
    name: Validate and Test OT Detections
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y suricata jq

      - name: Validate Suricata rules
        run: |
          sudo suricata -T \
            -c /etc/suricata/suricata.yaml \
            --set app-layer.protocols.modbus.enabled=yes \
            -S rules/ot-local.rules

      - name: Replay OT sample PCAP
        run: |
          mkdir -p logs/ci-test
          sudo suricata -r pcaps/sample.pcap \
            -c /etc/suricata/suricata.yaml \
            --set app-layer.protocols.modbus.enabled=yes \
            -S rules/ot-local.rules \
            -l logs/ci-test

      - name: Verify expected detection alerts
        run: |
          sudo jq -e '
            select(.event_type == "alert" and .alert.signature_id == 1001001)
          ' logs/ci-test/eve.json > /dev/null

          sudo jq -e '
            select(.event_type == "alert" and .alert.signature_id == 1001002)
          ' logs/ci-test/eve.json > /dev/null

          echo "PASS: Both expected Modbus detections generated alerts."
  checkov-terraform-scan:
    name: Checkov Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov

      - name: Scan Terraform configuration
        run: |
          checkov -d terraform --framework terraform --soft-fail
